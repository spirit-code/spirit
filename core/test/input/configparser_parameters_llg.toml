[defaults.output]
file_tag = "test_configparser_llg"
folder = "output"

[method.llg]
max_walltime        = "0:0:0"
seed                = 20006
n_iterations        = 2000000
n_iterations_log    = 2000
n_iterations_amortize = 1

temperature                      = 42
temperature_gradient.magnitude   = 3
temperature_gradient.direction   = [0, 1, 0]

damping             = 0.7
beta                = 0.3
dt                  = 1.0e-3
renorm              = false
force_convergence   = 10e-9

spin_current_model  = "monolayer"
spin_current_vector = [0.0, 1.0, 0.0]

[method.llg.output]
file_tag = "test_configparser_llg"

any     = true
initial = true
final   = true

energy_step                  = false
energy_archive               = true
energy_spin_resolved         = false
energy_divide_by_nspins      = true
energy_add_readability_lines = true

configuration_step     = true
configuration_archive  = false
configuration_filetype = 3
