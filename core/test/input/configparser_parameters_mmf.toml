[defaults.output]
file_tag = "test_configparser_mmf"
folder = "output"

[method.mmf]
max_walltime        = "0:0:0"
force_convergence   = 1e-7

n_iterations        = 20000
n_iterations_log    = 20
n_iterations_amortize = 1

n_modes         = 8
n_mode_follow   = 2

[method.mmf.output]
any     = true
initial = false
final   = false

energy_step                  = false
energy_archive               = true
energy_spin_resolved         = true
energy_divide_by_nspins      = true
energy_add_readability_lines = true

configuration_step     = false
configuration_archive  = true
configuration_filetype = 3
